name: Sync Aperture skill

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-aperture-skill
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build and validate distribution
        env:
          APERTURE_REPO: ${{ runner.temp }}/aperture
        run: |
          git clone --filter=blob:none https://github.com/kevin-courbet/aperture.git "$APERTURE_REPO"
          recorded_commit=$(node -e 'const record = require(process.argv[1]); process.stdout.write(record.commit)' ./sources/aperture.json)
          if git -C "$APERTURE_REPO" diff --quiet "$recorded_commit" origin/main -- skills/create-data-visualizations; then
            source_commit=$recorded_commit
          else
            source_commit=$(git -C "$APERTURE_REPO" rev-parse origin/main)
          fi
          bash scripts/sync-aperture-skill "$APERTURE_REPO" "$source_commit"
          bash scripts/validate-skills
          tar -czf "${{ runner.temp }}/aperture-skill.tar.gz" \
            skills/create-data-visualizations \
            sources/aperture.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aperture-skill
          path: ${{ runner.temp }}/aperture-skill.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aperture-skill
          path: ${{ runner.temp }}/distribution
      - name: Publish verified distribution
        env:
          STAGING_DIR: ${{ runner.temp }}/staging
        run: |
          mkdir -p "$STAGING_DIR"
          tar -xzf "${{ runner.temp }}/distribution/aperture-skill.tar.gz" -C "$STAGING_DIR"
          test -f "$STAGING_DIR/skills/create-data-visualizations/SKILL.md"
          test -f "$STAGING_DIR/sources/aperture.json"
          rsync -a --delete \
            "$STAGING_DIR/skills/create-data-visualizations/" \
            skills/create-data-visualizations/
          cp "$STAGING_DIR/sources/aperture.json" sources/aperture.json
          source_commit=$(jq -r .commit sources/aperture.json)
          git add -- skills/create-data-visualizations sources/aperture.json
          subject="Sync Aperture visualization skill"
          body="Source: kevin-courbet/aperture@$source_commit"
          if git diff --cached --quiet; then
            last_commit=$(git log -1 --format=%ct)
            now=$(date +%s)
            if (( now - last_commit < 2592000 )); then
              exit 0
            fi
            date -u +%Y-%m-%dT%H:%M:%SZ >.github/sync-heartbeat
            git add -- .github/sync-heartbeat
            subject="Keep Aperture skill sync active"
            body="Keep the scheduled publisher active during repository inactivity."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject" -m "$body"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git switch -c publish-retry origin/main
            rsync -a --delete \
              "$STAGING_DIR/skills/create-data-visualizations/" \
              skills/create-data-visualizations/
            cp "$STAGING_DIR/sources/aperture.json" sources/aperture.json
            git add -- skills/create-data-visualizations sources/aperture.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "$subject" -m "$body"
            git push origin HEAD:main
          fi
